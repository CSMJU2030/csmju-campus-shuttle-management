# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-campus-shuttle-management          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.8.4"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3206       # URL ของ frontend ตอนรันเพื่อทดสอบ (Next.js)
core_hub_url: https://csmju2030.jowave.com
core_hub_web_url: https://csmju2030.jowave.com
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/shuttle-routes
  not_found: /api/v1/shuttle-routes/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/shuttle-routes/not-a-uuid
  create:
    path: /api/v1/shuttle-routes
    allowed_role: staff
    denied_role: student
    invalid_body:
      name: ""
    valid_body:
      name: "Conformance route"

owners:
  pl: "@csmju2030/pl-campus-shuttle-management"
  aie: "@csmju2030/aie-campus-shuttle-management"

display_name: "UniRide รถรับส่งมหาวิทยาลัย"
repo: github.com/CSMJU2030/csmju-campus-shuttle-management
status: proposed
